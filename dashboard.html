<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    .notif-badge {
      position:absolute; top:-4px; right:-4px;
      background:#ff4444; color:white; font-size:10px; font-weight:700;
      min-width:16px; height:16px; border-radius:99px;
      display:flex; align-items:center; justify-content:center;
      padding:0 4px; line-height:1;
    }
    .nav-btn-wrap { position:relative; display:inline-block; }
    .match-filters {
      padding:10px 15px; display:flex; gap:8px; overflow-x:auto;
      scrollbar-width:none; flex-wrap:nowrap;
    }
    .match-filters::-webkit-scrollbar { display:none; }
    .mf-btn {
      padding:8px 14px; border-radius:20px; border:1px solid #333;
      background:#1a1a1a; color:#aaa; font-size:12px; font-weight:600;
      white-space:nowrap; cursor:pointer; flex-shrink:0;
    }
    .mf-btn.active { background:linear-gradient(135deg,#00ffd5,#00a8ff); color:black; border:none; }
    .match-search {
      margin:0 15px 10px;
      display:flex; align-items:center; gap:8px;
      background:#1a1a1a; border:1px solid #333; border-radius:12px;
      padding:10px 14px;
    }
    .match-search i { color:#555; }
    .match-search input {
      background:transparent; border:none; color:white; outline:none;
      font-size:14px; flex:1;
    }
  </style>
</head>
<body>

<header class="dashboard-header">
  <div class="profile-box">
    <div class="profile-icon"><i class="fa-solid fa-user"></i></div>
    <div>
      <h3>Player Dashboard</h3>
      <p id="playerEmail">Loading...</p>
    </div>
  </div>
</header>

<section class="scroll-announcement" id="scrollAnnouncement" style="display:none;">
  <div id="announcementTextDisplay"></div>
</section>

<section class="wallet-card">
  <h2>Wallet Balance</h2>
  <h1 id="walletBalance">₹0</h1>
</section>

<section class="quick-actions">
  <button data-action="goAddMoney"><i class="fa-solid fa-plus"></i> Add Money</button>
  <button data-action="goWithdraw"><i class="fa-solid fa-money-bill"></i> Withdraw</button>
  <button data-action="goHistory"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
  <button data-action="goWinners"><i class="fa-solid fa-trophy"></i> Winners</button>
</section>

<button data-action="goLeaderboard">🏆 Leaderboard</button>

<section class="notifications-panel">
  <div class="section-title-row">
    <h2>Notifications</h2>
    <button id="clearNotificationsBtn">Clear</button>
  </div>
  <div id="notificationsContainer"><p>Loading notifications...</p></div>
</section>

<section class="featured-card">
  <h2>🔥 Hot Tournament</h2>
  <p>Join today's biggest Free Fire battle and win massive rewards!</p>
  <button>Join Now</button>
</section>

<!-- MATCH SEARCH + FILTER -->
<div class="match-search" id="matchesContainer" style="scroll-margin-top:10px;">
  <i class="fa-solid fa-magnifying-glass"></i>
  <input type="text" id="matchSearch" placeholder="Search matches..." oninput="filterMatches()"/>
</div>

<div class="match-filters">
  <button class="mf-btn active" onclick="setMatchFilter('all', this)">🔥 All</button>
  <button class="mf-btn" onclick="setMatchFilter('upcoming', this)">🟢 Upcoming</button>
  <button class="mf-btn" onclick="setMatchFilter('live', this)">🔴 Live</button>
  <button class="mf-btn" onclick="setMatchFilter('solo', this)">👤 Solo</button>
  <button class="mf-btn" onclick="setMatchFilter('duo', this)">👥 Duo</button>
  <button class="mf-btn" onclick="setMatchFilter('squad', this)">👨‍👩‍👧‍👦 Squad</button>
  <button class="mf-btn" onclick="setMatchFilter('free', this)">🆓 Free</button>
</div>

<section class="matches" id="allMatchCards"></section>

<script type="module" src="dashboard.js"></script>

<footer>
  <div class="social-links">
    <a href="https://t.me/phantomwarzone" target="_blank" class="social-btn telegram"><i class="fa-brands fa-telegram"></i> Telegram Channel</a>
    <a href="https://t.me/Phantomwarzonesupport" target="_blank" class="social-btn support"><i class="fa-solid fa-headset"></i> Support</a>
    <a href="https://www.instagram.com/phantom_war_zone?igsh=MWxtdm4xc3Q0OHcxcw==" target="_blank" class="social-btn instagram"><i class="fa-brands fa-instagram"></i> Instagram</a>
  </div>
  <p>© 2026 Phantom Warzone</p>
</footer>

<nav class="bottom-nav">
  <button onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button onclick="document.getElementById('matchesContainer').scrollIntoView({behavior:'smooth'})" class="nav-join-btn">
    <i class="fa-solid fa-fire"></i><span>Join</span>
  </button>
  <button onclick="window.location.href='mymatches.html'"><i class="fa-solid fa-gamepad"></i><span>My Matches</span></button>
  <button onclick="window.location.href='history.html'"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
  <div class="nav-btn-wrap">
    <button onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
    <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
  </div>
</nav>

<div id="toast"></div>

<script>
let matchFilterMode = "all";

function setMatchFilter(mode, btn) {
  matchFilterMode = mode;
  document.querySelectorAll(".mf-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  filterMatches();
}

function filterMatches() {
  const search = (document.getElementById("matchSearch")?.value || "").toLowerCase();
  const cards  = document.querySelectorAll("#allMatchCards .card");
  cards.forEach(card => {
    const text   = card.innerText.toLowerCase();
    const type   = (card.dataset.type   || "").toLowerCase();
    const status = (card.dataset.status || "").toLowerCase();
    const entry  = Number(card.dataset.entry || 0);

    let show = true;
    if (search && !text.includes(search)) show = false;
    if (matchFilterMode === "upcoming" && !status.includes("upcoming")) show = false;
    if (matchFilterMode === "live"     && !status.includes("live"))     show = false;
    if (matchFilterMode === "solo"     && !type.includes("solo"))       show = false;
    if (matchFilterMode === "duo"      && !type.includes("duo"))        show = false;
    if (matchFilterMode === "squad"    && !type.includes("squad"))      show = false;
    if (matchFilterMode === "free"     && entry > 0)                    show = false;

    card.style.display = show ? "" : "none";
  });
}

window.addEventListener("load", () => {
  if (window.location.hash === "#matchesContainer") {
    setTimeout(() => {
      const el = document.getElementById("matchesContainer");
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }, 1500);
  }
});
</script>

<script>
function waitForFn(name, retries=20){
  return new Promise((resolve,reject)=>{
    const check=(i)=>{
      if(typeof window[name]==="function") resolve(window[name]);
      else if(i<=0) reject(new Error(name+" not ready"));
      else setTimeout(()=>check(i-1),150);
    };
    check(retries);
  });
}
document.addEventListener("DOMContentLoaded",()=>{
  document.body.addEventListener("click", async(e)=>{
    const btn=e.target.closest("[data-action]");
    if(!btn) return;
    const action=btn.dataset.action;
    // Simple nav actions — just call directly
    const navMap={
      goAddMoney:  ()=>window.location.href="addmoney.html",
      goWithdraw:  ()=>window.location.href="withdraw.html",
      goHistory:   ()=>window.location.href="history.html",
      goWinners:   ()=>window.location.href="winners.html",
      goLeaderboard:()=>window.location.href="leaderboard.html",
    };
    if(navMap[action]){ navMap[action](); return; }
    try{
      const fn=await waitForFn(action);
      fn();
    }catch(err){ console.error(action,err); }
  });
});
</script>
</body>
</html>
